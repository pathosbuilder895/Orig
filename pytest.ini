[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    postgres: marks tests that need a reachable DATABASE_URL Postgres instance (self-skip otherwise; deselect with '-m "not postgres"')
    certification: three-valued behavioural gate tests (pass/fail/uninformative)
    security: abuse-case / adversarial security suite
    perf: latency and concurrency budget tests
    boot: tests that spawn the server as a subprocess
    blocker: known-red test pinning a documented open product gap (docs/testing/10-gap-register.md); excluded from the main pytest run via -m "not blocker" and run separately by the known-red CI job, which fails if one passes or is skipped without a message containing "uninformative"
