[project]
name = "original"
version = "0.1.0"
description = "Original API — stylometric authorship detection"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py311"          # aligns with CI/Render; local .venv is still 3.9 (WS-2 task 2.6)
extend-exclude = [
  # The dormant v1 API surface (original/api, canvas, schemas_v1, middleware,
  # auth, tasks, main.py) was DELETED in WS-6 P6. original/db + original/core
  # were brought into lint scope in the T3 db/core cleanup: db/models/canvas.py
  # and the unused core/{config_patch,exceptions,limiter}.py were deleted, and
  # the rest (db/base.py, db/session.py, the remaining v1 models, core/config.py)
  # was linted in place — it stays because original.cli.delete_student (the
  # documented manual FERPA-deletion CLI) and original.cli.security_audit still
  # depend on it, and FK/relationship coupling among the v1 models prevents a
  # partial deletion (see original/db/models/__init__.py).
  "frontend", "web", "legacy_mvp", "demo/bluebook/vendor",
]

[tool.ruff.format]
# Deliberate column-aligned tables (ALL_FEATURE_CODES/NORM_BOUNDS); ruff format
# would collapse the alignment. Baked in here (not just a CLI --exclude flag)
# so pre-commit's ruff-format hook and a bare `ruff format .` respect it too.
exclude = ["original/constants.py"]

[tool.ruff.lint]
select = [
  "E", "F",        # pycodestyle / pyflakes
  "I",             # import sorting (replaces isort)
  "B",             # bugbear — mutable defaults, late-binding loops
  "UP",            # pyupgrade — keeps 3.11 idioms consistent
  "N",             # naming (math-var exceptions below)
]
# E741: ambiguous 1-letter names (l/O/I) -- common in math/quantum code, low value here.
# N806/N803: ρ/matrix math locals and params (P, ref_X etc.) are domain-idiomatic.
# B008: FastAPI's Depends()/File()/Form() call-as-default is the framework's own idiom.
ignore = ["E741", "N806", "N803", "B008"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Deliberate column-aligned tables (CLAUDE.md gates changes to feature ordering
# on explicit permission) -- also excluded from `ruff format` below.
"original/constants.py" = ["E501", "E402"]
# Deliberate late imports (see inline comments at each site) -- not a lint fix.
# UP007: response_model=Optional[X] is an eagerly-evaluated call argument, not a
# lazy annotation -- `X | None` would raise on the local 3.9 venv (PEP 604 needs
# 3.10+); revisit alongside the WS-2 task 2.6 venv rebuild.
# N814: StudentState imported as `_SS` (see call site) to avoid a heavy
# module-level import.
"original/api.py" = ["E402", "UP007", "N814", "E501"]
# The WS-7.3 router split moved api.py's handlers and their shared helpers into
# original/routers/ verbatim, so they inherit api.py's ignores above unchanged
# (the alternative is restructuring moved code purely to satisfy lint).
"original/routers/*.py" = ["E402", "UP007", "N814", "E501"]
# bbook_client field names mirror the external Bbook API's camelCase JSON.
"original/bbook_client.py" = ["N815"]
# Long lines here are professor-facing narrative prose / f-string templates --
# wrapping them makes the text harder to read and edit for no lint value.
"original/quantum/professor_narrative.py" = ["E501"]
"original/context/report.py" = ["E501"]
"original/explainer.py" = ["E501"]
"original/schemas.py" = ["E501"]
"original/lab/suggestions.py" = ["E501"]
# Deliberate column-aligned one-liner method stubs (PostgresRepository._todo table).
"original/repository.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["original/quantum", "original/features", "original/repository.py"]
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
