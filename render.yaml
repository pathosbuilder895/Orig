services:
  # ════════════════════════════════════════════════════════════════════════════
  # original-demo — the always-live, zero-login SALES DEMO (free tier).
  # Ephemeral by design: writes reset on each deploy; seeded from demo/seed.db.
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: original-demo
    runtime: python
    region: oregon
    plan: free

    # Slim install — requirements-demo.txt excludes PyTorch/sentence-transformers,
    # psycopg2, sqlalchemy, auth libs, and dev tools. Keeps the build under
    # Render's free-tier memory ceiling and within the 20-min build timeout.
    buildCommand: pip install -r requirements-demo.txt && python -m spacy download en_core_web_sm

    # --skip-seed: synthetic student profiles are pre-baked into demo/seed.db
    # (committed to the repo). Startup takes <1s — no ML pipeline runs at boot.
    startCommand: python run.py --demo --port $PORT --skip-seed

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Point the store at the pre-seeded SQLite file shipped in the repo.
      - key: ORIGINAL_DB
        value: demo/seed.db
      # Adaptive scoring phases 2-8 (context manifest + weight modification).
      - key: CONTEXT_MANIFEST_ENABLED
        value: "1"
      - key: ADAPTIVE_WEIGHTS_ENABLED
        value: "1"

  # ════════════════════════════════════════════════════════════════════════════
  # original-pilot — the REAL service: the public Bluebook site and the
  # institutional pilot (Starter plan, managed Postgres). Same dashboard app,
  # hardened by ORIGINAL_ENV=pilot:
  #   • boots REFUSE to start without a stable SECRET_KEY (fail-fast)
  #   • CORS locked to ALLOWED_ORIGINS (empty = nothing allowed)
  #   • HSTS on; destructive endpoints guarded by MAINTENANCE_TOKEN
  # Secrets (sync: false) are set once in the Render dashboard, never in git.
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: original-pilot
    runtime: python
    region: oregon
    plan: starter

    # Manual deploys only: a deploy is a release decision (never mid-exam),
    # made from the dashboard (docs/BLUEBOOK_LAUNCH_CHECKLIST.md). With no
    # disk attached, deploys are zero-downtime.
    autoDeploy: false

    # The pinned lock of requirements-pilot.txt: demo deps + LTI crypto + the
    # Postgres stack + sentry-sdk. Full requirements.txt pulls PyTorch and
    # will not fit Starter — do not "upgrade" this.
    buildCommand: pip install -r requirements-pilot.lock.txt && python -m spacy download en_core_web_sm

    # Schema first: every deploy migrates the database before the new code
    # takes traffic. A failed migration fails the deploy; the old version
    # keeps serving.
    preDeployCommand: alembic upgrade head

    # --skip-seed: a pilot must never boot with synthetic students. The
    # database starts empty; teachers sign up at /bluebook/ (self-serve) or
    # are provisioned via docs/PROVISIONING_CHECKLIST.md.
    startCommand: python run.py --demo --port $PORT --skip-seed

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # ── Persistence: managed Postgres is authoritative from day one ──
      # The pilot never ran on SQLite in production, so there is nothing to
      # cut over: no disk, no REPO_SHADOW soak. Backups: Render's own daily
      # snapshots plus the off-box job below (original-pg-backup).
      - key: REPO_BACKEND
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: original-db
          property: connectionString
      # Set to "1" (then deploy) to freeze writes for maintenance.
      - key: MAINTENANCE_MODE
        sync: false
      # ── Hardening mode: pilot fails fast without SECRET_KEY ──
      - key: ORIGINAL_ENV
        value: pilot
      # Stable signing key — set in dashboard. Generate:
      #   python -c "import secrets; print(secrets.token_urlsafe(64))"
      - key: SECRET_KEY
        sync: false
      # Guard token for destructive/provisioning endpoints (X-Guard-Token).
      - key: MAINTENANCE_TOKEN
        sync: false
      - key: GUARD_DESTRUCTIVE
        value: "1"
      # Lock CORS to the public URL of THIS service. With a custom domain,
      # list both (comma-separated) and set PUBLIC_BASE_URL to the domain.
      - key: ALLOWED_ORIGINS
        value: https://original-pilot.onrender.com
      # ── Account email (original/mailer.py) ──
      # Invitations and password resets go out through SendGrid when both
      # are set; without them the roster offers copy/download links instead.
      # MAIL_FROM must be a sender verified in SendGrid (domain authentication).
      - key: SENDGRID_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Absolute base for links in emails, e.g. https://bluebook.example.org
      # (no trailing slash). Unset → the request's own host.
      - key: PUBLIC_BASE_URL
        sync: false
      # ── Error reporting (original/monitoring.py) — unset = off ──
      - key: SENTRY_DSN
        sync: false
      - key: ENABLE_HSTS
        value: "1"
      # ── LTI 1.3 (Canvas) ──
      - key: LTI_TOOL_URL
        value: https://original-pilot.onrender.com
      # Tool RSA private key (PEM, \n-escaped). Generate: openssl genrsa 2048
      - key: LTI_PRIVATE_KEY
        sync: false
      # JSON array of registered platforms — set after the Canvas admin returns
      # the client_id/deployment_id (see docs/CANVAS_RUNBOOK.md).
      - key: LTI_PLATFORMS
        sync: false
      # Classroom release: research features remain explicitly off. run.py's
      # demo defaults must not enable these in the real pilot.
      - key: CONTEXT_MANIFEST_ENABLED
        value: "0"
      - key: ADAPTIVE_WEIGHTS_ENABLED
        value: "0"
      - key: STYLE_AUTHORSHIP_ENABLED
        value: "0"
      - key: FUSED_SCORE_ENABLED
        value: "0"
      - key: FUSED_SCORE_SHADOW
        value: "0"
      - key: LONGITUDINAL_DRIFT_ENABLED
        value: "0"
      # ── Bbook external exam app (original/bbook_client.py) ──
      # Outbound client for POST /students/{id}/request-baseline. Both unset
      # means that endpoint returns 503 with manual-upload guidance — the
      # in-repo /bluebook/ exam room does NOT depend on these. NOTE: because
      # this blueprint is already deployed and syncs ignore sync:false vars,
      # adding these here does NOT prompt for values — both must be set by
      # hand in the Render dashboard (docs/OPS_RUNBOOK.md). The secret must
      # equal the value configured on the Bbook side; do not generateValue.
      - key: BBOOK_API_URL
        sync: false
      - key: BBOOK_EXTERNAL_SECRET
        sync: false
      # ── AI-likelihood detector (second scoring mode) ──
      # Pilot weeks 1-4: ENABLED stays "0" (nothing is ever surfaced to
      # professors); SHADOW is dashboard-managed (sync: false) so ops can
      # start/stop silent persistence without a redeploy. Flip ENABLED only
      # after the shadow report passes the MODEL_CARD gate (real-world FPR
      # <= 5% at t_elevated on instructor-confirmed authentic submissions).
      - key: AI_LIKELIHOOD_ENABLED
        value: "0"
      - key: AI_LIKELIHOOD_SHADOW
        sync: false

  # ════════════════════════════════════════════════════════════════════════════
  # original-pg-backup — daily logical backup of the pilot database to
  # S3-compatible storage outside Render (scripts/pg_backup_offbox.py).
  # --require-upload makes a missing bucket setting a FAILED run in the
  # dashboard rather than a silent nightly no-op.
  # ════════════════════════════════════════════════════════════════════════════
  - type: cron
    name: original-pg-backup
    runtime: python
    region: oregon
    plan: starter
    schedule: "30 8 * * *"  # 08:30 UTC daily, outside US class hours
    buildCommand: pip install -r requirements-pilot.lock.txt
    startCommand: python scripts/pg_backup_offbox.py --require-upload
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: original-db
          property: connectionString
      - key: BACKUP_OFFBOX_ENABLED
        value: "1"
      - key: BACKUP_OFFBOX_PREFIX
        value: original-pg-backups/
      - key: BACKUP_OFFBOX_BUCKET
        sync: false
      - key: BACKUP_OFFBOX_ENDPOINT
        sync: false
      - key: BACKUP_OFFBOX_REGION
        sync: false
      - key: BACKUP_OFFBOX_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_OFFBOX_SECRET_ACCESS_KEY
        sync: false

databases:
  # The pilot's database. Internal-only (no public IP access); paid plan, so
  # it does not expire and Render takes daily snapshots.
  - name: original-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    databaseName: original
    user: original
    ipAllowList: []
