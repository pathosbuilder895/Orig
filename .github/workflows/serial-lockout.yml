name: Serial lockout E2E

# The one e2e test the main run cannot host.
#
# demo/bluebook/e2e/auth.spec.mjs's `Login throttle lockout @serial-lockout`
# deliberately exhausts the server's IP-keyed login throttle
# (_LOGIN_MAX_ATTEMPTS=10 per 300s, original/routers/_shared.py). Two things
# follow, and together they make it unhostable inside test.yml's `bundle-e2e`:
#
#   1. Tripping the throttle 429s every *other* spec's staff login for the
#      next 5 minutes — all 4 workers share one IP bucket.
#   2. bundle-e2e therefore raises LOGIN_THROTTLE_MAX_ATTEMPTS to 500, which
#      means this test could not reach a 429 in 11 attempts even if it ran.
#
# So test.yml excludes it with `--grep-invert "@serial-lockout"` and, until
# this workflow existed, it ran nowhere: 72 tests exist, 71 run on every PR,
# 1 ran only if someone remembered to invoke it by hand. This gives that one
# test a scheduled home rather than leaving the login lockout — a real
# security control — covered only in principle.
#
# Deliberately NOT on push/pull_request: it takes ~5 minutes of wall clock to
# be worth anything and it is testing a control that changes about once a
# year. Weekly + on demand is the right cadence; a red run here is a signal to
# read on Monday, not a merge blocker.

on:
  schedule:
    # 06:17 UTC every Monday. Off the hour on purpose — GitHub's scheduler
    # queues heavily at :00 and delays are longest there.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serial-lockout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: demo/bluebook/package-lock.json

      - name: Install Bluebook test dependencies
        run: cd demo/bluebook && npm ci

      # No bundle rebuild + freshness check here, unlike bundle-e2e: that gate
      # belongs on the PR that edits a .jsx, and test.yml already blocks a
      # stale bluebook.bundle.js from reaching main. Duplicating it on a weekly
      # cron would only report the same fact later and less usefully. This job
      # runs against the committed bundle, which is exactly what Render serves.

      - name: Install Python dependencies (pilot superset -- exercises /lti/*)
        run: pip install -r requirements-pilot.txt

      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Install Playwright browsers
        run: cd demo/bluebook && npx playwright install --with-deps chromium

      - name: Start Original demo server in pilot mode
        env:
          ORIGINAL_ENV: pilot
          SECRET_KEY: ci-test-only-secret-do-not-deploy
          MAINTENANCE_TOKEN: ci-test-only
          # LOGIN_THROTTLE_MAX_ATTEMPTS is deliberately NOT set here. The whole
          # point of this job is to observe the production default (10 per
          # 300s) actually engage; bundle-e2e's override of 500 is what makes
          # the test unrunnable there. Do not copy that line into this file.
        # --skip-seed is mandatory here: seeding hard-refuses when
        # ORIGINAL_ENV=pilot (synthetic data must never enter a real store),
        # and CI boots exactly the way the Render pilot does.
        run: |
          python run.py --demo --frontend-dir demo --port 8001 --skip-seed \
            > /tmp/original-ci.log 2>&1 &
          echo $! > /tmp/original.pid
          # Wait for server to become responsive (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start. Log:"
          cat /tmp/original-ci.log
          exit 1

      - name: Run the @serial-lockout spec
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8001
        # --workers=1: the tag selects one test today, but the flag is what
        # keeps that true if a second lockout case is ever added — two of them
        # in parallel would race for the same IP bucket and only one would see
        # its own 429.
        #
        # --retries=0 overrides playwright.config.mjs's `retries: CI ? 1 : 0`.
        # A retry here is worse than useless: the throttle this test just
        # tripped is still hot for 300s, so the retry's own tenant-provisioning
        # login 429s during setup and the run reports a fixture failure in
        # place of the real result.
        run: |
          cd demo/bluebook
          npx playwright test --grep "@serial-lockout" --workers=1 --retries=0

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-serial-lockout
          path: demo/bluebook/playwright-report/
          retention-days: 14

      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/original-ci.log || true

      - name: Stop Original server
        if: always()
        run: kill $(cat /tmp/original.pid) 2>/dev/null || true
