name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install -r requirements-dev.lock.txt

      # Scoped to original/ (the live package) -- tests/, validation/, scripts/,
      # and alembic/ were never swept for lint compliance and are out of WS-2's
      # scope; widen this once/if they're brought in line.
      - name: ruff check
        run: ruff check original/

      - name: ruff format --check
        run: ruff format --check original/

  pytest:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ validation/test_tier10_optional.py \
            --cov=original --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: cd app && npm ci

      - name: Lint
        run: cd app && npm run lint

      - name: Typecheck
        run: cd app && npm run typecheck

      - name: Unit + axe tests
        run: cd app && npm test

      - name: Build
        run: cd app && npm run build

  bundle-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: demo/bluebook/package-lock.json

      - name: Install Bluebook build/test dependencies
        run: cd demo/bluebook && npm ci

      - name: Rebuild bundle and check it's byte-identical to the committed one
        # Catches the "edited a .jsx but forgot to rebuild" failure mode --
        # Render has no Node, so the committed bluebook.bundle.js IS what
        # production serves.
        run: |
          cd demo/bluebook && npm run build
          git diff --exit-code -- bluebook.bundle.js || {
            echo "::error::bluebook.bundle.js is stale -- run 'cd demo/bluebook && npm run build' and commit the result."
            exit 1
          }

      - name: Install Python dependencies (pilot superset -- exercises /lti/*)
        run: pip install -r requirements-pilot.txt

      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Install Playwright browsers
        run: cd demo/bluebook && npx playwright install --with-deps chromium

      - name: Start Original demo server in pilot mode
        env:
          ORIGINAL_ENV: pilot
          SECRET_KEY: ci-test-only-secret-do-not-deploy
          MAINTENANCE_TOKEN: ci-test-only
        # --skip-seed is mandatory here: seeding hard-refuses when
        # ORIGINAL_ENV=pilot (synthetic data must never enter a real store),
        # and CI boots exactly the way the Render pilot does.
        run: |
          python run.py --demo --frontend-dir demo --port 8001 --skip-seed \
            > /tmp/original-ci.log 2>&1 &
          echo $! > /tmp/original.pid
          # Wait for server to become responsive (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start. Log:"
          cat /tmp/original-ci.log
          exit 1

      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8001
        run: cd demo/bluebook && npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: demo/bluebook/playwright-report/
          retention-days: 14

      - name: Stop Original server
        if: always()
        run: kill $(cat /tmp/original.pid) 2>/dev/null || true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true # non-blocking until findings are triaged once
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: pip-audit (pilot lockset)
        run: |
          pip install pip-audit
          pip-audit -r requirements-pilot.lock.txt

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
