name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks-action calls GET /pulls/{n}/commits to scope its scan to the PR
  # diff on pull_request events — read-only, no write scopes granted.
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install -r requirements-dev.lock.txt

      # Scoped to original/ (the live package) -- tests/, validation/, scripts/,
      # and alembic/ were never swept for lint compliance and are out of WS-2's
      # scope; widen this once/if they're brought in line.
      - name: ruff check
        run: ruff check original/

      - name: ruff format --check
        run: ruff format --check original/

  pytest:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    # WS-6 P3: gives the contract suite's "postgres" backend parametrization
    # (tests/test_repository_contract.py) something real to run against —
    # it self-skips cleanly without this, so its absence was silent rather
    # than a failure. DATABASE_URL below is picked up by
    # original/db/postgres_session.py and the contract suite's own
    # `_postgres_available()` check.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: original
          POSTGRES_PASSWORD: original
          POSTGRES_DB: original_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U original"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run pytest with coverage
        # Ratcheted from 70 (WS-2) to 72 (WS-5) -- the measured floor after
        # the WS-5 test-depth work (live-fixture migration, bluebook API +
        # store tests, scoring flag-matrix tests, tier10 ST-backend test,
        # dead-module deletion). The doc's aspirational targets (overall 78,
        # api.py 75, store.py 85) are NOT yet met -- api.py sits at 71% and
        # store.py at 80% (measured 2026-07-16), both still short. Do not raise this past what
        # `--cov-report=term-missing` actually shows passing locally.
        env:
          DATABASE_URL: postgresql://original:original@localhost:5432/original_test
        run: |
          python -m pytest tests/ validation/test_tier10_optional.py \
            --cov=original --cov-report=xml --cov-fail-under=72

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: cd app && npm ci

      - name: Lint
        run: cd app && npm run lint

      - name: Typecheck
        run: cd app && npm run typecheck

      - name: Unit + axe tests
        run: cd app && npm test

      - name: Build
        run: cd app && npm run build

  bundle-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: demo/bluebook/package-lock.json

      - name: Install Bluebook build/test dependencies
        run: cd demo/bluebook && npm ci

      - name: Rebuild bundle and check it's byte-identical to the committed one
        # Catches the "edited a .jsx but forgot to rebuild" failure mode --
        # Render has no Node, so the committed bluebook.bundle.js IS what
        # production serves.
        run: |
          cd demo/bluebook && npm run build
          git diff --exit-code -- bluebook.bundle.js || {
            echo "::error::bluebook.bundle.js is stale -- run 'cd demo/bluebook && npm run build' and commit the result."
            exit 1
          }

      - name: Install Python dependencies (pilot superset -- exercises /lti/*)
        run: pip install -r requirements-pilot.txt

      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Install Playwright browsers
        run: cd demo/bluebook && npx playwright install --with-deps chromium

      - name: Start Original demo server in pilot mode
        env:
          ORIGINAL_ENV: pilot
          SECRET_KEY: ci-test-only-secret-do-not-deploy
          MAINTENANCE_TOKEN: ci-test-only
          # The e2e suite provisions a distinct tenant+staff login per test
          # (tenant-isolation coverage needs real, separate logins) — that
          # legitimately exceeds the production default of 10 logins per
          # 300s from one IP well before the suite finishes. Raised for this
          # job only; pilot/production keep the default (original/api.py).
          LOGIN_THROTTLE_MAX_ATTEMPTS: "500"
        # --skip-seed is mandatory here: seeding hard-refuses when
        # ORIGINAL_ENV=pilot (synthetic data must never enter a real store),
        # and CI boots exactly the way the Render pilot does.
        run: |
          python run.py --demo --frontend-dir demo --port 8001 --skip-seed \
            > /tmp/original-ci.log 2>&1 &
          echo $! > /tmp/original.pid
          # Wait for server to become responsive (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start. Log:"
          cat /tmp/original-ci.log
          exit 1

      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8001
          # exam-flow.spec.mjs mints a proctor attestation client-side (the
          # mint is intentionally never exposed over HTTP) and must sign it
          # with the same secret the server above was started with.
          SECRET_KEY: ci-test-only-secret-do-not-deploy
        # @serial-lockout is excluded: it deliberately trips the login
        # throttle, which would otherwise 429 every other spec's staff
        # login in this same run (see e2e/auth.spec.mjs) — and the raised
        # LOGIN_THROTTLE_MAX_ATTEMPTS above means it can't even trigger the
        # 429 it's testing for within a reasonable attempt count anyway.
        # Runs standalone, e.g.: npx playwright test --workers=1 -g "throttle lockout"
        run: cd demo/bluebook && npx playwright test --grep-invert "@serial-lockout"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: demo/bluebook/playwright-report/
          retention-days: 14

      - name: Stop Original server
        if: always()
        run: kill $(cat /tmp/original.pid) 2>/dev/null || true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking: the one known finding (PYSEC-2026-1325, ecdsa timing
    # side-channel) has already been triaged and explicitly ignored below
    # with a documented reachability argument. A new finding should fail
    # the build until it gets the same treatment.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # gitleaks-action diffs the PR's base..head commit range, which
          # must exist in the local clone. The default fetch-depth: 1 only
          # fetches the tip, so `git log <base>^..<head>` fails with
          # "unknown revision" on any PR with more than one commit — full
          # history is the documented gitleaks-action requirement for scans.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: pip-audit (pilot lockset)
        run: |
          pip install pip-audit
          # PYSEC-2026-1325 (ecdsa, transitive via python-jose): no fixed
          # version exists upstream — this is the long-documented python-ecdsa
          # pure-Python timing side-channel that the maintainers treat as
          # out of scope for a version bump. Original's LTI JWT verification
          # is hardcoded to RS256 only (original/lti.py:252), so python-jose's
          # ecdsa-backed ES256/384/512 path is never invoked — unreachable in
          # this app. Re-check this ignore if a fix ships, or if ES* algorithms
          # are ever added to lti.py's `algorithms=` allowlist.
          pip-audit -r requirements-pilot.lock.txt --ignore-vuln PYSEC-2026-1325

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
