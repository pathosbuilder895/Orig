name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks-action calls GET /pulls/{n}/commits to scope its scan to the PR
  # diff on pull_request events — read-only, no write scopes granted.
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install -r requirements-dev.lock.txt

      # Scoped to original/ (the live package) -- tests/, validation/, scripts/,
      # and alembic/ were never swept for lint compliance and are out of WS-2's
      # scope; widen this once/if they're brought in line.
      - name: ruff check
        run: ruff check original/

      - name: ruff format --check
        run: ruff format --check original/

  # ---------------------------------------------------------------------
  # THE BLOCKING PYTEST LANE — three path-based shards + coverage-combine.
  #
  # Until 2026-09-08 this was ONE serial `pytest` job. Its cap had already
  # been raised 20 -> 30 because of RUNNER VARIANCE, not suite growth; every
  # measurement below is the same single job on ubuntu-latest:
  #
  #   ~9m10s   common ancestor, ~99 commits back
  #    17m57s  main (fused score, POSNoise, tier-17 rehearsal, seminary corpus)
  #    >20m    genre-resolver branch — CANCELLED at the then-20m cap; pytest
  #            itself had passed, so it read as a test failure when it was a
  #            clock failure
  #    18m17s  same branch after trimming its own tests
  #    15m06s  the two MERGED
  #    21m     Phase A measurement of the full blocking set
  #
  # A job whose true cost is ~15-21m swings wide enough on shared runners to
  # hit its own cap, and it already did once. That job's own comment said the
  # next person to add a multi-minute test should split it into a matrix
  # rather than raise the number again. This is that split (T-46,
  # docs/testing/09-test-infrastructure-ci.md §1.1).
  #
  # Shard membership is defined in ONE place — scripts/shard_paths.py — and
  # tests/test_shard_partition.py proves by collection that the three
  # selections partition the full blocking set exactly (union == all, pairwise
  # disjoint), so no test can be silently un-run. Measured collected counts at
  # the split: core 1012, api 1061, rest 1531, union == full 3604.
  #
  # `rest` is `tests/` MINUS --ignore for everything the other two shards own,
  # which is what makes "un-run" structurally impossible rather than a thing
  # to remember. Re-run any red shard locally with the same selection:
  #     python scripts/shard_paths.py --run api
  #
  # Caps are 20 minutes each: shards should land ≤ 10 min on CI (the 21m
  # single-job figure split three ways, with `core` carrying the fusion six at
  # 72-82s each), and 20 leaves the same ~2x variance headroom the 30m cap
  # gave the serial job. Do not raise these — reduce the shard, or add a
  # fourth. Heaviest tests as of the split, measured locally: the six
  # tests/fusion/test_wiring.py cases at ~72-82s EACH (~8m, all in `core`),
  # then test_dirichlet_multinomial_drift ~32s, test_calibration_scoring_config
  # ~31s, test_feature_pipeline_determinism ~23s + ~17s. --durations=25 on
  # every shard keeps that list current without anyone measuring by hand.
  #
  # Coverage: each shard runs --cov=original --cov-branch with
  # --cov-report= (no report) and a distinct COVERAGE_FILE, then uploads its
  # data file. --cov-fail-under is NOT set on any shard — a single shard's
  # coverage of `original/` is meaningless. The ≥98 floor is enforced once, on
  # the combined number, in coverage-combine below.
  #
  # Only pytest-api gets the Postgres service (tests/test_repository_contract.py
  # parametrizes over a "postgres" backend and self-skips without a reachable
  # DATABASE_URL, so its absence was silent rather than a failure — WS-6 P3).
  # The other two shards drop it and start faster.
  # ---------------------------------------------------------------------
  pytest-core:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run pytest (core shard) with coverage
        env:
          COVERAGE_FILE: .coverage.core
        # `--run` has shard_paths.py exec `python -m pytest <shard args> <these
        # extra args>` via os.execv — no shell, no quoting round-trip.
        run: >
          python scripts/shard_paths.py --run core
          -m "not blocker and not certification"
          --cov=original --cov-branch --cov-report= --durations=25
          -p no:cacheprovider

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-core
          path: .coverage.core
          # The data file is dotfile-named so coverage combine can find it;
          # upload-artifact skips hidden files unless told otherwise.
          include-hidden-files: true
          retention-days: 1

  pytest-api:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    # The one shard that needs a real Postgres — see the block comment above.
    # DATABASE_URL below is picked up by original/db/postgres_session.py and
    # the contract suite's own `_postgres_available()` check.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: original
          POSTGRES_PASSWORD: original
          POSTGRES_DB: original_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U original"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Run pytest (api shard) with coverage
        env:
          COVERAGE_FILE: .coverage.api
          DATABASE_URL: postgresql://original:original@localhost:5432/original_test
        run: >
          python scripts/shard_paths.py --run api
          -m "not blocker and not certification"
          --cov=original --cov-branch --cov-report= --durations=25
          -p no:cacheprovider

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-api
          path: .coverage.api
          include-hidden-files: true
          retention-days: 1

  pytest-rest:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm

      # Home of tests/test_shard_partition.py, which re-derives the partition
      # from scripts/shard_paths.py on every run — so this shard is also the
      # one that fails if a new test file stops belonging to exactly one shard.
      - name: Run pytest (rest shard) with coverage
        env:
          COVERAGE_FILE: .coverage.rest
        run: >
          python scripts/shard_paths.py --run rest
          -m "not blocker and not certification"
          --cov=original --cov-branch --cov-report= --durations=25
          -p no:cacheprovider

      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-rest
          path: .coverage.rest
          include-hidden-files: true
          retention-days: 1

  # The ONE place the coverage floor is enforced. Ratcheted 70 (WS-2) -> 72
  # (WS-5) -> 78 (#104, additional API coverage tests) -> 98 (2026-08-20,
  # branch-coverage effort, docs/superpowers/plans/2026-08-17-branch-coverage-*.md).
  # The 78 floor measured LINE coverage only; --cov-branch switched the
  # measured metric to statements+branches combined, which is why the floor
  # jumped rather than crept -- a line can be "covered" while one of its
  # conditional arms never ran, and --cov-branch is what actually catches
  # that. Full-suite measured combined coverage was 99.61% (11601 stmts/45
  # missing, 3024 branches/12 missing+10 partial) on 2026-08-20; 98 leaves
  # headroom for runner variance. Do not raise this past what
  # `coverage report -m` actually shows passing locally.
  #
  # Splitting the run does not change the combined number: `coverage combine`
  # unions the three shards' arc data, and all three shards run from the repo
  # root on the same runner image, so the recorded file paths already match
  # and no [paths] remapping is needed.
  coverage-combine:
    runs-on: ubuntu-latest
    needs: [pytest-core, pytest-api, pytest-rest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      # requirements-dev.txt rather than a bare `pip install coverage`: it
      # pins pytest-cov==7.1.0, whose coverage is the exact version the three
      # shards wrote these data files with. requirements.txt is not needed —
      # `coverage report` parses original/*.py, it does not import it.
      - name: Install coverage (same version the shards measured with)
        run: pip install -r requirements-dev.txt

      # upload-artifact above is at v7.0.1 and the v4+ artifact backend is
      # shared, so this v4 download reads a v7 upload.
      - name: Download the three shards' coverage data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine and enforce the floor
        run: |
          coverage combine
          coverage report --fail-under=98
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14


  # Home of the whole certification group, which the pytest shards above
  # deselect (-m "not blocker and not certification"): these tests provision
  # profiles through the live API and cost minutes, which does not belong in
  # the blocking per-PR lane.
  #
  # Two steps, blocking on opposite conditions:
  #   1. Certification WITNESSES (`certification and not blocker`) must PASS.
  #      A witness proves the harness can detect the failure its blocker pins;
  #      if the witness breaks, the blocker's red proves nothing.
  #   2. @pytest.mark.blocker tests — known-red tests that pin documented open
  #      product gaps (docs/testing/10-gap-register.md) — must NOT pass. This
  #      step fails the day one of them unexpectedly PASSES, or is SKIPPED
  #      without a message containing "uninformative" (a bare skip is not a
  #      way to make a red test green — see scripts/known_red.py and
  #      pytest.ini's `blocker` marker docstring).
  # No Postgres service — these tests don't need one.
  known-red:
    runs-on: ubuntu-latest
    needs: lint
    # The four certification tests measured 5:31 wall on a 12-core Darwin
    # box; ubuntu-latest runners are 2-core, and this job also pays for
    # pip install, the spaCy model download, and the perf + lockset
    # blockers on top of the certification witnesses — 20 minutes was
    # too tight.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Certification witnesses (must pass)
        run: python -m pytest tests/ -m "certification and not blocker" -q -p no:cacheprovider

      - name: Run known-red policy check
        run: python scripts/known_red.py

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        run: cd app && npm ci

      - name: Lint
        run: cd app && npm run lint

      - name: Typecheck
        run: cd app && npm run typecheck

      - name: Unit + axe tests (with coverage thresholds)
        run: cd app && npm run test:coverage

      - name: Build
        run: cd app && npm run build

  bundle-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: demo/bluebook/package-lock.json

      - name: Install Bluebook build/test dependencies
        run: cd demo/bluebook && npm ci

      - name: Rebuild bundle and check it's byte-identical to the committed one
        # Catches the "edited a .jsx but forgot to rebuild" failure mode --
        # Render has no Node, so the committed bluebook.bundle.js IS what
        # production serves.
        run: |
          cd demo/bluebook && npm run build
          git diff --exit-code -- bluebook.bundle.js || {
            echo "::error::bluebook.bundle.js is stale -- run 'cd demo/bluebook && npm run build' and commit the result."
            exit 1
          }

      - name: Install Python dependencies (pilot superset -- exercises /lti/*)
        run: pip install -r requirements-pilot.txt

      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Install Playwright browsers
        run: cd demo/bluebook && npx playwright install --with-deps chromium

      - name: Start Original demo server in pilot mode
        env:
          ORIGINAL_ENV: pilot
          SECRET_KEY: ci-test-only-secret-do-not-deploy
          MAINTENANCE_TOKEN: ci-test-only
          # The e2e suite provisions a distinct tenant+staff login per test
          # (tenant-isolation coverage needs real, separate logins) — that
          # legitimately exceeds the production default of 10 logins per
          # 300s from one IP well before the suite finishes. Raised for this
          # job only; pilot/production keep the default (original/api.py).
          LOGIN_THROTTLE_MAX_ATTEMPTS: "500"
        # --skip-seed is mandatory here: seeding hard-refuses when
        # ORIGINAL_ENV=pilot (synthetic data must never enter a real store),
        # and CI boots exactly the way the Render pilot does.
        run: |
          python run.py --demo --frontend-dir demo --port 8001 --skip-seed \
            > /tmp/original-ci.log 2>&1 &
          echo $! > /tmp/original.pid
          # Wait for server to become responsive (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start. Log:"
          cat /tmp/original-ci.log
          exit 1

      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8001
          # exam-flow.spec.mjs mints a proctor attestation client-side (the
          # mint is intentionally never exposed over HTTP) and must sign it
          # with the same secret the server above was started with.
          SECRET_KEY: ci-test-only-secret-do-not-deploy
        # @serial-lockout is excluded here for two independent reasons: it
        # deliberately trips the login throttle, which would otherwise 429
        # every other spec's staff login in this same run (see
        # e2e/auth.spec.mjs), and the raised LOGIN_THROTTLE_MAX_ATTEMPTS
        # above means it could not trigger the 429 it asserts on anyway.
        # It is NOT skipped in CI — the three steps below run it against a
        # second, default-throttle server. Keep this exclusion.
        run: cd demo/bluebook && npx playwright test --grep-invert "@serial-lockout"

      # ---------------------------------------------------------------
      # Login-throttle lockout: the one spec that needs the PRODUCTION
      # throttle limit, run against its own server.
      #
      # WHY A SECOND SERVER RATHER THAN FOLDING THIS BACK INTO THE FIRST:
      # e2e/auth.spec.mjs's "@serial-lockout" spec drives exactly 11 bad
      # logins and asserts the server answers "Too many sign-in attempts."
      # That assertion is only reachable at the production default of 10
      # (LOGIN_THROTTLE_MAX_ATTEMPTS, original/routers/_shared.py:228). The
      # first server above raises the limit to 500 because the rest of the
      # suite legitimately needs hundreds of real logins — under 500 the
      # 429 can never fire and the spec passes vacuously. The two limits
      # are mutually exclusive inside one process: the value is read once
      # at import and the attempt counter is a process-global, IP-keyed
      # dict. So without this second server a security-relevant control
      # has a test that CANNOT FAIL. Do not "simplify" these steps away.
      # ---------------------------------------------------------------
      - name: Stop the raised-throttle server
        # It must be fully down before the lockout server binds :8001.
        # Otherwise the health poll in the next step would pass against the
        # OLD (raised-throttle) server while the new one silently failed to
        # bind — and the spec would go right back to being vacuous, with a
        # green check on it. Poll /health until it STOPS answering.
        run: |
          kill "$(cat /tmp/original.pid)" 2>/dev/null || true
          for i in $(seq 1 30); do
            if ! curl -sf http://localhost:8001/health > /dev/null; then
              echo "Raised-throttle server down after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Something is still answering on :8001 after 30s -- refusing to start the lockout server on top of it."
          exit 1

      - name: Start Original demo server at the DEFAULT login throttle
        # Identical env to the first server EXCEPT that
        # LOGIN_THROTTLE_MAX_ATTEMPTS is deliberately absent, so the
        # production default of 10 applies. Distinct pid/log files so the
        # cleanup step can reap both independently.
        env:
          ORIGINAL_ENV: pilot
          SECRET_KEY: ci-test-only-secret-do-not-deploy
          MAINTENANCE_TOKEN: ci-test-only
        # --skip-seed for the same reason as above: seeding hard-refuses
        # under ORIGINAL_ENV=pilot. The spec provisions its own tenant and
        # staff login over REST, so it needs no seeded state.
        run: |
          python run.py --demo --frontend-dir demo --port 8001 --skip-seed \
            > /tmp/original-ci-lockout.log 2>&1 &
          echo $! > /tmp/original-lockout.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null; then
              echo "Lockout server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Lockout server failed to start. Log:"
          cat /tmp/original-ci-lockout.log
          exit 1

      - name: Run the login-throttle lockout spec
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8001
          SECRET_KEY: ci-test-only-secret-do-not-deploy
        # --workers=1: the spec exhausts a process-global, IP-keyed bucket,
        # so nothing else may be logging in beside it.
        # --retries=0 overrides the config's CI retry (playwright.config.mjs
        # sets retries: 1). A retry here cannot help and actively hurts: the
        # throttle window is 300s, so a retry starting seconds later hits
        # the still-exhausted bucket in its OWN fixture setup
        # (provisionTenantWithStaff calls /auth/login), and the reported
        # failure becomes "staffLogin failed: 429" instead of the real
        # assertion failure.
        run: cd demo/bluebook && npx playwright test --workers=1 --retries=0 -g "@serial-lockout"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: demo/bluebook/playwright-report/
          retention-days: 14

      - name: Stop Original servers
        if: always()
        # BOTH servers: the raised-throttle one (normally already stopped
        # mid-job, but still running if the main Playwright step failed)
        # and the default-throttle lockout one. Either pid file may be
        # absent if the job failed before that step ran — don't orphan
        # whichever one did start.
        run: |
          for pidfile in /tmp/original.pid /tmp/original-lockout.pid; do
            [ -f "$pidfile" ] && kill "$(cat "$pidfile")" 2>/dev/null || true
          done

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking: the one known finding (PYSEC-2026-1325, ecdsa timing
    # side-channel) has already been triaged and explicitly ignored below
    # with a documented reachability argument. A new finding should fail
    # the build until it gets the same treatment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks-action diffs the PR's base..head commit range, which
          # must exist in the local clone. The default fetch-depth: 1 only
          # fetches the tip, so `git log <base>^..<head>` fails with
          # "unknown revision" on any PR with more than one commit — full
          # history is the documented gitleaks-action requirement for scans.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: pip-audit (pilot lockset)
        run: |
          pip install pip-audit
          # PYSEC-2026-1325 (ecdsa, transitive via python-jose): no fixed
          # version exists upstream — this is the long-documented python-ecdsa
          # pure-Python timing side-channel that the maintainers treat as
          # out of scope for a version bump. Original's LTI JWT verification
          # is hardcoded to RS256 only (original/lti.py:252), so python-jose's
          # ecdsa-backed ES256/384/512 path is never invoked — unreachable in
          # this app. Re-check this ignore if a fix ships, or if ES* algorithms
          # are ever added to lti.py's `algorithms=` allowlist.
          pip-audit -r requirements-pilot.lock.txt --ignore-vuln PYSEC-2026-1325

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
