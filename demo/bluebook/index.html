<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bluebook — Examination Platform</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; }

    body {
      background: #001020;
      color: #F0EDE4;
      font-family: 'EB Garamond', serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* Film-grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: -50%;
      width: 200%; height: 200%;
      pointer-events: none;
      z-index: 9998;
      opacity: 0.022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }

    ::selection { background: rgba(201,169,97,0.28); color: #001020; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #001020; }
    ::-webkit-scrollbar-thumb { background: #0A2D5E; }
    ::-webkit-scrollbar-thumb:hover { background: #C9A961; }

    /* ── Animations ─────────────────────────────────────────── */
    @keyframes bbFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .bb-screen { animation: bbFadeIn 0.65s ease both; }

    @keyframes bbPulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    @keyframes bbSaveDot {
      0%   { opacity: 0; transform: scale(0.6); }
      20%  { opacity: 1; transform: scale(1); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes bbSlideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Input focus ────────────────────────────────────────── */
    input:focus {
      border-color: rgba(201,169,97,0.7) !important;
      outline: none;
    }
    textarea { caret-color: #C9A961; }

    /* Autofill override */
    input:-webkit-autofill,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #F0EDE4;
      -webkit-box-shadow: 0 0 0 1000px #001C3B inset;
      transition: background-color 5000s;
    }

    /* Normalize button / input */
    button { cursor: pointer; }
    input, textarea, button { font-family: inherit; }

    /* ── Keyboard focus (WS-4) ──────────────────────────────────
       Div-as-button rows (role="button") get no native focus ring,
       so give every keyboard-focusable custom control a visible one. */
    [role="button"]:focus-visible,
    [role="switch"]:focus-visible,
    [role="radio"]:focus-visible {
      outline: 2px solid #C9A961;
      outline-offset: 2px;
    }
  </style>

  <!-- React is bundled inside bluebook.bundle.js (build.mjs) — no CDN, no
       vendored global <script> tags. Same bundle in dev and production, so
       the no-CDN-at-exam-time invariant holds by construction. -->
</head>
<body>
  <div id="root"></div>

  <!-- Launch bootstrap: an LTI / magic-link launch can bind a verified student
       to this exam via the URL, e.g.
         /bluebook/?sid=northfield:ab12cd34&candidate=Jane%20Doe&exam=Ethics
       so the proctored baseline lands on that student's canonical Original
       profile (not the demo candidate label). Plain JS — runs before the app. -->
  <script>
  (function () {
    try {
      var q = new URLSearchParams(location.search);
      var cfg = window.BB_EXAM_CONFIG = window.BB_EXAM_CONFIG || {};
      if (q.get('sid'))       localStorage.setItem('bluebook_student_id', q.get('sid'));
      if (q.get('email'))     { localStorage.setItem('bluebook_candidate_email', q.get('email')); cfg.candidateEmail = q.get('email'); }
      if (q.get('tenant'))    localStorage.setItem('original_tenant', q.get('tenant'));
      if (q.get('candidate')) cfg.candidate = q.get('candidate');
      if (q.get('exam'))      cfg.title = q.get('exam');
    } catch (e) {}
  })();
  </script>

  <!-- Precompiled bundle (run `npm install && npm run build` to produce it).
       Module graph resolved by esbuild from app.jsx — no load-order to keep
       in sync. -->
  <script src="bluebook.bundle.js"></script>
</body>
</html>
